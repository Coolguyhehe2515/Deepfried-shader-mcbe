name: build
on:
  push:
  workflow_dispatch:
    inputs:
      only:
        type: string
        description: Comma-separated materials (empty = all)
        default: ""
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ONLY: ${{ inputs.only }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lazurite==0.12.0
      - name: Shaderc
        run: |
          mkdir -p tools
          curl -fL -o tools/shaderc https://github.com/devendrn/newb-shader/releases/download/dev/shaderc-linux-x64
          chmod +x tools/shaderc
          echo "SHADERC_PATH=tools/shaderc" >> "$GITHUB_ENV"
          echo "PROFILE=android" >> "$GITHUB_ENV"
      - name: Vanilla materials
        run: |
          curl -fL -o mats.zip https://github.com/devendrn/newb-shader/releases/download/dev/src-materials-1.26.60.zip
          python -c "import zipfile,os; os.makedirs('vanilla',exist_ok=True); z=zipfile.ZipFile('mats.zip'); [open(os.path.join('vanilla',os.path.basename(n)),'wb').write(z.read(n)) for n in z.namelist() if n.endswith('.material.json')]"
          ls vanilla
      - run: python build.py
      - run: ls pack/renderer/materials
      - uses: actions/upload-artifact@v4
        with:
          name: deep-fried
          path: pack/
